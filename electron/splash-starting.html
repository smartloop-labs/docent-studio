<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    :root {
      --sl-bg-base: #000000;
      --sl-bg-surface-1: #1a1a1a;
      --sl-bg-surface-2: #2a2a2a;
      --sl-bg-surface-3: #3a3a3a;
      --sl-brand-primary: #ec4899;
      --sl-text-primary: #ffffff;
      --sl-text-secondary: #e5e7eb;
      --sl-text-disabled: #6b7280;
      --sl-text-faint: #4b5563;
      --sl-border-default: #2a2a2a;
      --splash-error: rgb(248, 113, 113);
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }

    .splash-container {
      background: var(--sl-bg-base);
      border-radius: 8px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
      padding: 24px;
      gap: 20px;
    }

    /* Brand: the app-icon tile beside the wordmark. */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .brand-tile {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid rgba(10, 10, 20, 0.1);
      background: linear-gradient(180deg, #ffffff, #f0f0f3);
    }

    .brand-tile svg {
      width: 26px;
      height: 26px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .logo {
      display: flex;
      gap: 6px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .logo-text {
      color: var(--sl-text-primary);
    }

    .logo-studio {
      color: var(--sl-brand-primary);
    }

    .tagline {
      color: var(--sl-text-disabled);
      font-size: 10px;
    }

    /* Progress: the steps, the status line and the bar read as one block,
       pinned to the foot of the window under the brand. */
    .progress {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 16px;
    }

    /* Steps: every stage of startup, in order, with the current one lit. */
    .steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--sl-text-faint);
      transition: color 0.3s ease;
    }

    .step.done {
      color: var(--sl-text-disabled);
    }

    .step.active {
      color: var(--sl-text-secondary);
      font-weight: 600;
    }

    .step.failed {
      color: var(--splash-error);
      font-weight: 600;
    }

    /* A square per step, in the lantern's pixel style: outlined while waiting,
       pulsing while running, filled once done. */
    .step-mark {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      box-sizing: border-box;
      border-radius: 2px;
      border: 1.5px solid var(--sl-bg-surface-3);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .step.done .step-mark {
      border-color: var(--sl-brand-primary);
      background: var(--sl-brand-primary);
    }

    .step.active .step-mark {
      border-color: var(--sl-brand-primary);
      background: var(--sl-brand-primary);
      animation: pulse 1s ease-in-out infinite;
    }

    .step.failed .step-mark {
      border-color: var(--splash-error);
      background: var(--splash-error);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* One progress bar for the whole of startup. */
    .splash-footer {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .version {
      align-self: flex-end;
      font-size: 10px;
      color: var(--sl-text-faint);
      font-variant-numeric: tabular-nums;
    }

    .status-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      color: var(--sl-text-disabled);
    }

    .status-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-text.error {
      color: var(--splash-error);
      font-weight: 600;
      white-space: normal;
    }

    .status-percent {
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--sl-bg-surface-2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--sl-brand-primary);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      transition: width 0.4s ease;
    }

    /* A step with no measurable progress keeps the bar alive with a sheen
       instead of pretending to a percentage. */
    .progress-fill.busy::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      animation: sheen 1.4s ease-in-out infinite;
    }

    .progress-fill.error {
      background: var(--splash-error);
    }

    @keyframes sheen {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>

<body>
  <div class="splash-container">
    <div class="brand">
      <div class="brand-tile">
        <svg viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true">
          <path fill="#0a0a0f" d="M3 0h3v2h2v1h-1v5h1v1h-7v-1h1v-5h-1v-1h2zM4 1v1h1v-1z" fill-rule="evenodd" />
          <path fill="#ec4899" d="M3 4h1v3h-1zM5 4h1v3h-1z" />
        </svg>
      </div>
      <div class="brand-text">
        <div class="logo">
          <span class="logo-text">docent</span><span class="logo-studio">studio</span>
        </div>
        <div class="tagline">Your private AI assistant: documents, systems, skills</div>
      </div>
    </div>

    <div class="progress">
      <ol class="steps" id="steps"></ol>

      <div class="splash-footer">
        <div class="status-row">
          <span class="status-text" id="status-text"></span>
          <span class="status-percent" id="status-percent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill busy" id="progress-fill"></div>
        </div>
        <span class="version" id="version"></span>
      </div>
    </div>
  </div>

  <script>
    // The main process owns startup and its state; this page only draws what it
    // is handed. renderSplash is called with the whole state every time, so a
    // call that lands before or after any other leaves the same picture.
    //
    //   { steps: [{ id, label }], index, percent, busy, message, error, version }

    // The status line is for what the step list can't say (a download's size,
    // an error). A message that only repeats the current step's label is noise.
    function sameText(a, b) {
      var norm = function (t) { return String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, ''); };
      return norm(a) === norm(b);
    }

    window.renderSplash = function (state) {
      var list = document.getElementById('steps');
      if (list.children.length !== state.steps.length) {
        list.innerHTML = '';
        state.steps.forEach(function (step) {
          var li = document.createElement('li');
          li.className = 'step';
          var mark = document.createElement('span');
          mark.className = 'step-mark';
          var label = document.createElement('span');
          label.textContent = step.label;
          li.appendChild(mark);
          li.appendChild(label);
          list.appendChild(li);
        });
      }

      Array.prototype.forEach.call(list.children, function (li, i) {
        var status = '';
        if (i < state.index) status = 'done';
        else if (i === state.index) status = state.error ? 'failed' : 'active';
        li.className = 'step' + (status ? ' ' + status : '');
      });

      var text = document.getElementById('status-text');
      var current = state.steps[state.index];
      var detail = current && sameText(state.message, current.label) ? '' : state.message;
      text.textContent = state.error || detail || '';
      text.className = 'status-text' + (state.error ? ' error' : '');

      var percent = Math.max(0, Math.min(100, Math.round(state.percent || 0)));
      var count = Math.min(state.index + 1, state.steps.length) + ' of ' + state.steps.length;
      document.getElementById('status-percent').textContent = state.error ? '' : count + ' · ' + percent + '%';
      document.getElementById('version').textContent = state.version ? 'v' + state.version : '';

      var fill = document.getElementById('progress-fill');
      fill.style.width = percent + '%';
      fill.className = 'progress-fill'
        + (state.error ? ' error' : '')
        + (state.busy && !state.error ? ' busy' : '');
    };
  </script>
</body>

</html>
